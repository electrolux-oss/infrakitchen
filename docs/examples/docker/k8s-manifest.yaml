---
# Service for InfraKitchen backend
apiVersion: v1
kind: Service
metadata:
  name: infrakitchen
  labels:
    app.kubernetes.io/name: infrakitchen
    app.kubernetes.io/instance: infrakitchen
    app.kubernetes.io/component: infrakitchen
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
    - name: http-backend
      port: 8080
      targetPort: backend
      protocol: TCP
      nodePort: null
  selector:
    app.kubernetes.io/name: infrakitchen
    app.kubernetes.io/instance: infrakitchen
    app.kubernetes.io/component: infrakitchen
---
# Deployment for InfraKitchen backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrakitchen
  labels:
    app.kubernetes.io/name: infrakitchen
    app.kubernetes.io/instance: infrakitchen
    app.kubernetes.io/component: infrakitchen
  annotations:
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: infrakitchen
      app.kubernetes.io/instance: infrakitchen
      app.kubernetes.io/component: infrakitchen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infrakitchen
        app.kubernetes.io/instance: infrakitchen
        app.kubernetes.io/component: infrakitchen
      annotations:
    spec:
      serviceAccountName: <SERVICE_ACCOUNT_NAME>

      containers:
        - name: infrakitchen-backend
          image: <IMG_NAME>
          imagePullPolicy: "Always"
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            failureThreshold: 10
            httpGet:
              path: /zstatus
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          livenessProbe:
            failureThreshold: 10
            httpGet:
              path: /zstatus
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          env:
            - name: POSTGRES_HOST
              value: <POSTGRES_HOST>
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: infrakitchen
            - name: POSTGRES_DB
              value: infrakitchen
            - name: POSTGRES_MIGRATIONS
              value: "true"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: infrakitchen-secrets
                  key: postgres-password

            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: infrakitchen-secrets
                  key: jwt-secret
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: infrakitchen-secrets
                  key: enc-secret
            - name: SESSION_EXPIRATION
              value: "86400"
          ports:
            - name: backend
              containerPort: 8080
              protocol: TCP
---
# Deployment for InfraKitchen scheduler
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrakitchen-scheduler
  labels:
    app.kubernetes.io/name: infrakitchen
    app.kubernetes.io/instance: infrakitchen
    app.kubernetes.io/component: infrakitchen-scheduler
  annotations:
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: infrakitchen
      app.kubernetes.io/instance: infrakitchen
      app.kubernetes.io/component: infrakitchen-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infrakitchen
        app.kubernetes.io/instance: infrakitchen
        app.kubernetes.io/component: infrakitchen-scheduler
      annotations:
    spec:
      serviceAccountName: <SERVICE_ACCOUNT_NAME>

      containers:
        - name: infrakitchen-scheduler
          image: <IMG_NAME>
          imagePullPolicy: "Always"
          command:
            - /app/.venv/bin/python
            - scheduler.py
          resources:
            limits:
              cpu: 1000m
              memory: 1024Mi
            requests:
              cpu: 300m
              memory: 256Mi
          env:
            - name: POSTGRES_HOST
              value: <POSTGRES_HOST>
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: infrakitchen
            - name: POSTGRES_DB
              value: infrakitchen
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: infrakitchen-secrets
                  key: postgres-password
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: infrakitchen-secrets
                  key: jwt-secret
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: infrakitchen-secrets
                  key: enc-secret
          ports:
            - name: backend
              containerPort: 8080
              protocol: TCP
---
# Deployment for InfraKitchen worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrakitchen-worker
  labels:
    app.kubernetes.io/name: infrakitchen
    app.kubernetes.io/instance: infrakitchen
    app.kubernetes.io/component: infrakitchen-worker
  annotations:
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: infrakitchen
      app.kubernetes.io/instance: infrakitchen
      app.kubernetes.io/component: infrakitchen-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infrakitchen
        app.kubernetes.io/instance: infrakitchen
        app.kubernetes.io/component: infrakitchen-worker
      annotations:
    spec:
      serviceAccountName: <SERVICE_ACCOUNT_NAME>

      containers:
        - name: infrakitchen-worker
          image: <IMG_NAME>
          imagePullPolicy: "Always"
          command:
            - /app/.venv/bin/python
            - worker.py
          resources:
            limits:
              cpu: 1000m
              memory: 1024Mi
            requests:
              cpu: 300m
              memory: 256Mi
          env:
            # the provider proxy, reached through the cluster DNS
            - name: TF_PROVIDER_MIRROR_URL
              value: https://infrakitchen-provider-proxy.<NAMESPACE>.svc:8090/
            # trust the internal CA of the proxy certificate besides the system CAs
            - name: SSL_CERT_DIR
              value: /etc/provider-proxy-ca
            - name: POSTGRES_HOST
              value: <POSTGRES_HOST>
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: infrakitchen
            - name: POSTGRES_DB
              value: infrakitchen
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: infrakitchen-secrets
                  key: postgres-password
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: infrakitchen-secrets
                  key: jwt-secret
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: infrakitchen-secrets
                  key: enc-secret
          ports:
            - name: backend
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: provider-proxy-ca
              mountPath: /etc/provider-proxy-ca
              readOnly: true
      volumes:
        - name: provider-proxy-ca
          secret:
            secretName: infrakitchen-provider-proxy-tls
            items:
              - key: ca.crt
                path: ca.crt
---
# Ingress for InfraKitchen (NGINX Controller example)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infrakitchen
  labels:
    app.kubernetes.io/name: infrakitchen
    app.kubernetes.io/instance: infrakitchen
    app.kubernetes.io/component: infrakitchen
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-internal
    ingress.kubernetes.io/rewrite-target: /
    kubernetes.io/ingress.class: nginx
    kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 11M
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/upgrade-proxy: "true"
    nginx.org/client-max-body-size: 10m
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
      - <HOST_NAME>
      secretName: ik-tls
  rules:
    - host: <HOST_NAME>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infrakitchen
                port:
                  number: 8080
---
# Cache of the provider proxy
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: infrakitchen-provider-proxy
  labels:
    app.kubernetes.io/name: infrakitchen
    app.kubernetes.io/instance: infrakitchen
    app.kubernetes.io/component: infrakitchen-provider-proxy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
# Deployment for the provider proxy (caching proxy for tofu providers), same image
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrakitchen-provider-proxy
  labels:
    app.kubernetes.io/name: infrakitchen
    app.kubernetes.io/instance: infrakitchen
    app.kubernetes.io/component: infrakitchen-provider-proxy
spec:
  # one replica: the cache volume is ReadWriteOnce
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: infrakitchen
      app.kubernetes.io/instance: infrakitchen
      app.kubernetes.io/component: infrakitchen-provider-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infrakitchen
        app.kubernetes.io/instance: infrakitchen
        app.kubernetes.io/component: infrakitchen-provider-proxy
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: infrakitchen-provider-proxy
          image: <IMG_NAME>
          imagePullPolicy: "Always"
          command:
            - /app/.venv/bin/uvicorn
            - provider_proxy:app
            - --host
            - 0.0.0.0
            - --port
            - "8090"
            - --ssl-keyfile
            - /etc/provider-proxy-tls/tls.key
            - --ssl-certfile
            - /etc/provider-proxy-tls/tls.crt
          env:
            - name: CACHE_DIR
              value: /var/cache/provider-proxy
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
              scheme: HTTPS
          ports:
            - name: provider-proxy
              containerPort: 8090
              protocol: TCP
          volumeMounts:
            - name: cache
              mountPath: /var/cache/provider-proxy
            - name: tls
              mountPath: /etc/provider-proxy-tls
              readOnly: true
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: infrakitchen-provider-proxy
        - name: tls
          secret:
            secretName: infrakitchen-provider-proxy-tls
---
# Service for the provider proxy
apiVersion: v1
kind: Service
metadata:
  name: infrakitchen-provider-proxy
  labels:
    app.kubernetes.io/name: infrakitchen
    app.kubernetes.io/instance: infrakitchen
    app.kubernetes.io/component: infrakitchen-provider-proxy
spec:
  type: ClusterIP
  ports:
    - name: provider-proxy
      port: 8090
      targetPort: provider-proxy
      protocol: TCP
  selector:
    app.kubernetes.io/name: infrakitchen
    app.kubernetes.io/instance: infrakitchen
    app.kubernetes.io/component: infrakitchen-provider-proxy
---
# Certificate for the provider proxy: tofu accepts only HTTPS mirrors. The proxy is not exposed outside the
# cluster, so the certificate comes from an internal CA issuer (e.g. a cert-manager CA issuer); its secret
# includes `ca.crt`, which the workers trust.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: infrakitchen-provider-proxy
  labels:
    app.kubernetes.io/name: infrakitchen
    app.kubernetes.io/instance: infrakitchen
    app.kubernetes.io/component: infrakitchen-provider-proxy
spec:
  secretName: infrakitchen-provider-proxy-tls
  dnsNames:
    - infrakitchen-provider-proxy
    - infrakitchen-provider-proxy.<NAMESPACE>.svc
    - infrakitchen-provider-proxy.<NAMESPACE>.svc.cluster.local
  issuerRef:
    kind: ClusterIssuer
    name: <INTERNAL_CA_ISSUER>
