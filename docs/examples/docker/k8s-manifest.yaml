  selector:
    matchLabels:
      app.kubernetes.io/name: infrakitchen
      app.kubernetes.io/instance: infrakitchen
      app.kubernetes.io/component: infrakitchen-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infrakitchen
        app.kubernetes.io/instance: infrakitchen
        app.kubernetes.io/component: infrakitchen-worker
      annotations:
    spec:
      serviceAccountName: <SERVICE_ACCOUNT_NAME>

      containers:
        - name: infrakitchen-worker
          image: <IMG_NAME>
          imagePullPolicy: "Always"
          command:
            - /app/.venv/bin/python
            - worker.py
          resources:
            limits:
              cpu: 1000m
              memory: 1024Mi
            requests:
              cpu: 300m
              memory: 256Mi
          env:
            - name: POSTGRES_HOST
              value: <POSTGRES_HOST>
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: infrakitchen
            - name: POSTGRES_DB
              value: infrakitchen
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: infrakitchen-secrets
                  key: postgres-password
            - name: BROKER_URL
              value: <RabbitMQ_URL>
              # example value: amqp://guest:password@infrakitchen-rabbitmq:5672
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: infrakitchen-secrets
                  key: jwt-secret
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: infrakitchen-secrets
                  key: enc-secret
          ports:
            - name: backend
              containerPort: 8080
              protocol: TCP
---
# Ingress for InfraKitchen (NGINX Controller example)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infrakitchen
  labels:
    app.kubernetes.io/name: infrakitchen
    app.kubernetes.io/instance: infrakitchen
    app.kubernetes.io/component: infrakitchen
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-internal
    ingress.kubernetes.io/rewrite-target: /
    kubernetes.io/ingress.class: nginx
    kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 11M
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/upgrade-proxy: "true"
    nginx.org/client-max-body-size: 10m
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
      - <HOST_NAME>
      secretName: ik-tls
  rules:
    - host: <HOST_NAME>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infrakitchen
                port:
                  number: 8080
